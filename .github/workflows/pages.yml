name: Deploy project website

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'assets/screenshots/v0.1.8/mission-sorting.png'
      - 'assets/screenshots/v0.1.8/mission-route-map.png'
      - 'assets/screenshots/v0.1.8/radio-activity.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Stage public website files only
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp site/index.html site/styles.css site/favicon.svg site/sitemap.xml _site/
          cp assets/screenshots/v0.1.8/mission-sorting.png _site/assets/
          cp assets/screenshots/v0.1.8/mission-route-map.png _site/assets/
          cp assets/screenshots/v0.1.8/radio-activity.png _site/assets/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
